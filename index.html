<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrontPageCORE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f1ea; --panel:#ffffff; --ink:#1f2420; --muted:#5f665f; --line:#dcd8c8; --field:#faf9f5; --btn:#2d5a34; --btnink:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161a17;--panel:#1f2521;--ink:#eceee8;--muted:#a3aaa2;--line:#37403a;--field:#171c18;--btn:#7fbf88;--btnink:#10200f;}
}
:root[data-theme="dark"]{--bg:#161a17;--panel:#1f2521;--ink:#eceee8;--muted:#a3aaa2;--line:#37403a;--field:#171c18;--btn:#7fbf88;--btnink:#10200f;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;max-width:1180px;margin:0 auto;padding:20px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;align-self:start;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
h1{font:700 22px/1.2 Fraunces,Georgia,serif;margin:0 0 4px}
.hint{color:var(--muted);margin:0 0 14px;font-size:13px}
label{display:block;font-weight:500;font-size:13px;margin:12px 0 4px}
input[type=text],input[type=date],textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:64px}
input:focus-visible,textarea:focus-visible,button:focus-visible,.swatch:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logo-row{display:flex;gap:10px;align-items:center}
.logo-row input[type=file]{font-size:13px;max-width:100%}
.swatches{display:flex;gap:8px;margin-top:4px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
button.primary{background:var(--btn);color:var(--btnink);border-color:var(--btn);flex:1}
.stage{display:flex;justify-content:center;min-width:0}

/* The paper */
.paper{--accent:#2d5a34;--gold:#a87f2a;container-type:inline-size;width:100%;max-width:620px;aspect-ratio:210/297;background:#fff;color:#1f2420;box-shadow:0 1px 3px rgba(0,0,0,.2),0 12px 40px rgba(0,0,0,.12);}
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 20cqw}
.paper *{color:inherit}
.logo{width:18cqw;height:18cqw;border-radius:50%;border:.5cqw solid var(--gold);background:#fff center/contain no-repeat;margin-bottom:6cqw;display:none;overflow:hidden}
.logo.on{display:block}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.title{font:900 7.4cqw/1.1 Fraunces,Georgia,serif;margin:0;text-align:center;letter-spacing:-.01em}
.sub{font:400 3.3cqw/1.3 Fraunces,Georgia,serif;color:var(--accent);margin:1.6cqw 0 0;text-align:center}
.sub{color:var(--accent)}
.rows{width:100%;margin-top:7cqw;border-top:.25cqw solid #d9d3b8}
.row{display:flex;justify-content:space-between;gap:4cqw;padding:1.4cqw 0;border-bottom:.2cqw solid #e5e1d0;font-size:2.35cqw;line-height:1.35}
.row b{color:var(--accent);font-weight:600;flex:none}
.row span{text-align:right;min-width:0;overflow-wrap:anywhere}
.row.multi span{text-align:left;margin-left:auto;max-width:72%}
.row.multi{align-items:flex-start}
.row.multi span{text-align:right}
.row[hidden]{display:none}

/* Designs */
.designs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.dbtn{padding:7px 4px;font-size:13px;font-weight:500;text-align:center}
.dbtn[aria-pressed="true"]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.paper{position:relative;overflow:hidden}
.cname{display:none}
.paper:not([data-design="classic"]) .row[data-k="college"]{display:none}

/* Framed */
.paper[data-design="framed"] .sheet{padding:0 17cqw}
.paper[data-design="framed"]::before{content:"";position:absolute;inset:4cqw;border:.6cqw solid var(--accent)}
.paper[data-design="framed"]::after{content:"";position:absolute;inset:5.6cqw;border:.2cqw solid var(--accent)}
.paper[data-design="framed"] .cname{display:block;font:700 3.6cqw/1.25 Fraunces,Georgia,serif;color:var(--accent);text-align:center;margin-bottom:6cqw}
.paper[data-design="framed"] .logo{margin-bottom:3cqw}
.paper[data-design="framed"] .rows{border-top:0;margin-top:8cqw}
.paper[data-design="framed"] .row{flex-direction:column;align-items:center;gap:.2cqw;border-bottom:0;padding:1.1cqw 0}
.paper[data-design="framed"] .row b{font-size:2cqw;font-weight:500;opacity:.85}
.paper[data-design="framed"] .row span,.paper[data-design="framed"] .row.multi span{text-align:center;max-width:100%;margin:0;font-size:2.7cqw}

/* Sidebar */
.paper[data-design="sidebar"] .sheet{align-items:flex-start;padding:0 12cqw 0 22cqw}
.paper[data-design="sidebar"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9cqw;background:var(--accent)}
.paper[data-design="sidebar"] .logo{margin-bottom:3cqw}
.paper[data-design="sidebar"] .cname{display:block;font:600 3cqw/1.25 Inter,system-ui,sans-serif;margin-bottom:9cqw}
.paper[data-design="sidebar"] .title{text-align:left;font-size:9cqw}
.paper[data-design="sidebar"] .sub{text-align:left}
.paper[data-design="sidebar"] .rows{border-top:0;margin-top:8cqw}
.paper[data-design="sidebar"] .row{justify-content:flex-start;border-bottom:0;padding:1cqw 0}
.paper[data-design="sidebar"] .row b{width:22cqw}
.paper[data-design="sidebar"] .row span,.paper[data-design="sidebar"] .row.multi span{text-align:left;max-width:none;margin:0}

/* Banner */
.paper[data-design="banner"] .sheet{justify-content:flex-start;padding:8cqw 14cqw 0}
.paper[data-design="banner"]::before{content:"";position:absolute;left:0;right:0;top:0;height:40cqw;background:var(--accent)}
.paper[data-design="banner"] .logo{position:relative;border-color:#fff;margin-bottom:3cqw;width:16cqw;height:16cqw}
.paper[data-design="banner"] .cname{display:block;position:relative;color:#fff;font:700 3.8cqw/1.25 Fraunces,Georgia,serif;text-align:center}
.paper[data-design="banner"] .title{margin-top:20cqw}
.paper[data-design="banner"] .rows{margin-top:auto;margin-bottom:14cqw}

/* Minimal */
.paper[data-design="minimal"] .sheet{align-items:flex-start;justify-content:flex-start;padding:14cqw 16cqw}
.paper[data-design="minimal"] .logo{border:0;border-radius:0;width:26cqw;height:26cqw;margin-bottom:4cqw}
.paper[data-design="minimal"] .cname{display:block;font:500 2.8cqw/1.25 Inter,system-ui,sans-serif;color:var(--accent)}
.paper[data-design="minimal"] .title{margin-top:auto;text-align:left;font-weight:400;font-size:10cqw;letter-spacing:-.02em}
.paper[data-design="minimal"] .sub{text-align:left;font-size:3.6cqw}
.paper[data-design="minimal"] .rows{border-top:0;margin-top:8cqw}
.paper[data-design="minimal"] .rows::before{content:"";display:block;width:12cqw;height:.7cqw;background:var(--accent);margin-bottom:4cqw}
.paper[data-design="minimal"] .row{border-bottom:0;padding:.8cqw 0;justify-content:flex-start}
.paper[data-design="minimal"] .row b{width:22cqw;font-weight:500;opacity:.8}
.paper[data-design="minimal"] .row span,.paper[data-design="minimal"] .row.multi span{text-align:left;max-width:none;margin:0}

@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:12px}
  form{position:static;max-height:none}
}
@media print{
  @page{size:A4;margin:0}
  :root{padding:0}
  body{background:#fff}
  .app{display:block;padding:0;max-width:none}
  form,.stage>*:not(.paper){display:none!important}
  .stage{display:block}
  .paper{width:210mm;max-width:none;height:297mm;box-shadow:none;break-after:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
  <form id="f" onsubmit="return false">
    <h1>FrontPageCORE</h1>
    <p class="hint">Fill in the details. The page updates as you type.</p>

    <label>Design</label>
    <div class="designs" id="ds"></div>

    <label for="logo">College logo</label>
    <div class="logo-row"><input id="logo" type="file" accept="image/*"></div>

    <label for="college">College name</label>
    <input id="college" type="text" placeholder="College name" autocomplete="off">

    <label for="title">Title</label>
    <input id="title" type="text" placeholder="e.g. Lab Report, Assignment" autocomplete="off">

    <label for="subtitle">Subject or topic</label>
    <input id="subtitle" type="text" placeholder="Subject name" autocomplete="off">

    <div class="two">
      <div><label for="program">Program</label><input id="program" type="text" placeholder="Program and branch" autocomplete="off"></div>
      <div><label for="semester">Semester</label><input id="semester" type="text" placeholder="Semester" autocomplete="off"></div>
    </div>

    <label for="students">Student names (one per line)</label>
    <textarea id="students" placeholder="One name per line"></textarea>

    <div class="two">
      <div><label for="roll">Roll no.</label><input id="roll" type="text" placeholder="Optional" autocomplete="off"></div>
      <div><label for="date">Date</label><input id="date" type="date"></div>
    </div>

    <label for="to">Submitted to</label>
    <input id="to" type="text" placeholder="Professor’s name" autocomplete="off">

    <label>Accent color</label>
    <div class="swatches" id="sw"></div>

    <div class="actions">
      <button class="primary" id="print" type="button">Save as PDF</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <p class="hint" style="margin-top:10px">In the print dialog, choose “Save as PDF” and set margins to None.</p>
  </form>

  <div class="stage">
    <div class="paper" id="paper"><div class="sheet">
      <div class="logo" id="pLogo"></div>
      <div class="cname" id="pCollege"></div>
      <h2 class="title" id="pTitle"></h2>
      <p class="sub" id="pSub"></p>
      <div class="rows">
        <div class="row" data-k="college"><b>College</b><span></span></div>
        <div class="row" data-k="program"><b>Program</b><span></span></div>
        <div class="row" data-k="semester"><b>Semester</b><span></span></div>
        <div class="row multi" data-k="students"><b>Student</b><span></span></div>
        <div class="row" data-k="roll"><b>Roll No.</b><span></span></div>
        <div class="row" data-k="to"><b>Submitted to</b><span></span></div>
        <div class="row" data-k="date"><b>Date</b><span></span></div>
      </div>
    </div></div>
  </div>
</div>

<script>
(function(){
  var KEY='cover-page-maker-v2';
  var colors=['#2d5a34','#1f3d73','#7a1f2b','#4a3a7a','#1f1f1f'];
  var ids=['college','title','subtitle','program','semester','students','roll','date','to'];
  var el={}; ids.forEach(function(i){el[i]=document.getElementById(i)});
  var paper=document.getElementById('paper'), pLogo=document.getElementById('pLogo');
  var state={logo:'',accent:colors[0],design:'classic'};
  var defaults={};
  ids.forEach(function(i){defaults[i]=el[i].value});
  var today=new Date(); var iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  defaults.date='';

  function load(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY)||'null');
      if(s){ids.forEach(function(i){if(s[i]!==undefined)el[i].value=s[i]});state.logo=s.logo||'';state.accent=s.accent||colors[0];state.design=s.design||'classic';}
    }catch(e){}
  }
  function save(){
    try{
      var s={logo:state.logo,accent:state.accent,design:state.design};
      ids.forEach(function(i){s[i]=el[i].value});
      localStorage.setItem(KEY,JSON.stringify(s));
    }catch(e){}
  }
  function fmtDate(v){
    if(!v)return '';
    var p=v.split('-'); if(p.length!==3)return v;
    var m=['January','February','March','April','May','June','July','August','September','October','November','December'];
    return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+' '+p[0];
  }
  function render(){
    document.getElementById('pTitle').textContent=el.title.value;
    var sub=document.getElementById('pSub'); sub.textContent=el.subtitle.value; sub.hidden=!el.subtitle.value.trim();
    paper.style.setProperty('--accent',state.accent);
    paper.dataset.design=state.design;
    document.getElementById('pCollege').textContent=el.college.value.trim();
    document.querySelectorAll('.dbtn').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.d===state.design))});
    pLogo.innerHTML='';
    if(state.logo){var im=new Image();im.alt='College logo';im.src=state.logo;pLogo.appendChild(im);pLogo.classList.add('on')}else pLogo.classList.remove('on');
    var vals={
      college:el.college.value.trim(),
      program:el.program.value.trim(),
      semester:el.semester.value.trim(),
      students:el.students.value.split('\n').map(function(x){return x.trim()}).filter(Boolean).join(', '),
      roll:el.roll.value.trim(),
      to:el.to.value.trim(),
      date:fmtDate(el.date.value)
    };
    document.querySelectorAll('.row').forEach(function(r){
      var v=vals[r.dataset.k]; r.hidden=!v; r.querySelector('span').textContent=v;
    });
    document.querySelectorAll('.swatch').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.c===state.accent))});
    save();
  }
  var sw=document.getElementById('sw');
  colors.forEach(function(c){
    var b=document.createElement('button');b.type='button';b.className='swatch';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label','Accent '+c);
    b.onclick=function(){state.accent=c;render()};sw.appendChild(b);
  });
  var ds=document.getElementById('ds');
  [['classic','Classic'],['framed','Framed'],['sidebar','Sidebar'],['banner','Banner'],['minimal','Minimal']].forEach(function(d){
    var b=document.createElement('button');b.type='button';b.className='dbtn';b.dataset.d=d[0];b.textContent=d[1];
    b.onclick=function(){state.design=d[0];render()};ds.appendChild(b);
  });
  ids.forEach(function(i){el[i].addEventListener('input',render)});
  document.getElementById('logo').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=400,s=Math.min(1,max/Math.max(img.width,img.height));
        var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        state.logo=c.toDataURL('image/png');render();
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });
  document.getElementById('print').onclick=function(){window.print()};
  document.getElementById('reset').onclick=function(){
    ids.forEach(function(i){el[i].value=defaults[i]});
    state.logo='';state.accent=colors[0];document.getElementById('logo').value='';render();
  };
  load();render();
})();
</script>
</body>
</html>
